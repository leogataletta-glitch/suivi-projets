<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dashboard | Léo</title>
<script>try{var _t=localStorage.getItem("suivi-theme");if(_t==="dark"||(!_t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("theme-dark")}catch(e){}</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fbfdff,#f2f6fb);font:15px/1.6 "Segoe UI",Arial,sans-serif;color:#243831;padding:16px}
.card{width:min(380px,100%);background:#fff;border:1px solid #dce4ee;border-radius:22px;padding:30px 28px;box-shadow:0 13px 32px #30364b12}
.mark{width:46px;height:46px;border-radius:15px;background:#e6eefb;color:#2b4e7b;display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:16px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 20px;color:#6b7590;font-size:13px}
label{display:block;font-size:13px;margin-bottom:6px}
input[type=password]{width:100%;padding:11px 13px;border:1px solid #cdd8e6;border-radius:11px;font:inherit}
input[type=password]:focus{outline:2px solid #9fb3cc;border-color:#9fb3cc}
.remember{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:13px;color:#545d70}
button{width:100%;padding:11px;border:0;border-radius:11px;background:#2b4e7b;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
html.theme-dark body{background:linear-gradient(145deg,#161b26,#10141c);color:#e4e8f0}html.theme-dark .card{background:#1c2230;border-color:#2c3446;box-shadow:none}html.theme-dark .mark{background:#26314a;color:#a9c1e6}html.theme-dark p,html.theme-dark .remember{color:#9aa4b8}html.theme-dark input[type=password]{background:#141924;border-color:#34405a;color:#e4e8f0}html.theme-dark button{background:#3b64a0}
#msg{min-height:20px;margin:12px 0 0;font-size:13px;color:#b42318}
</style>
</head>
<body>
<form class="card" id="f" hidden>
 <div class="mark">L</div>
 <h1>Espace de travail</h1>
 <p>Contenu protégé. Saisis ton mot de passe pour ouvrir le tableau de bord.</p>
 <label for="pw">Mot de passe</label>
 <input id="pw" type="password" autocomplete="current-password" required autofocus>
 <label class="remember"><input id="rem" type="checkbox"> Se souvenir sur cet appareil</label>
 <button id="go" type="submit">Ouvrir</button>
 <div id="msg" role="alert"></div>
</form>
<script>
(async()=>{
const KEYSTORE='suivi-cle',$=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
let pack;
async function getPack(){if(!pack){const r=await fetch('app.enc.json',{cache:'no-store'});if(!r.ok)throw new Error('fetch');pack=await r.json()}return pack}
async function keyFromPassword(pw,p){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open(key){const p=await getPack();const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));const html=new TextDecoder().decode(plain).replace(/<\/head>/i,'<link rel="stylesheet" href="weight-compact.css?v=7"></head>').replace(/<\/body>/i,'<script src="food-catalog.js?v=2"></scr'+'ipt><script src="food-library.js?v=3"></scr'+'ipt><script src="weight-daily.js?v=1"></scr'+'ipt></body>');document.open();document.write(html);document.close()}
try{const saved=localStorage.getItem(KEYSTORE);if(saved){const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',true,['decrypt']);await open(key);return}}catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}
$('f').hidden=false;$('pw').focus();
$('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;$('msg').textContent='';
 try{const p=await getPack();const key=await keyFromPassword($('pw').value,p);
  let ok=false;try{await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},key,b64(p.ct));ok=true}catch(_){}
  if(!ok){$('msg').textContent='Mot de passe incorrect.';$('go').disabled=false;$('pw').select();return}
  if($('rem').checked){try{localStorage.setItem(KEYSTORE,toB64(await crypto.subtle.exportKey('raw',key)))}catch(_){}}
  await open(key)}
 catch(err){$('msg').textContent='Impossible de charger le tableau de bord. Vérifie ta connexion.';$('go').disabled=false}};
})();
</script>
</body>
</html>
